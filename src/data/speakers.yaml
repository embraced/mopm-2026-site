  photo: ""
  bio_zh: "專精於高通量蛋白質體學與系統生物學，開發了包含 HuProt 與 VirD 等功能性蛋白質微陣列平台，使研究人員得以進行大規模的多體學研究。"
  bio_en: "Specializing in high-throughput proteomics and systems biology; Dr. Zhu developed functional protein microarrays—such as the HuProt and VirD platforms—that enable researchers to conduct large-scale multi-omics research."
