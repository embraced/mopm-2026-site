  photo: "/speaker-yu-ju-chen.webp"
  bio_zh: "中央研究院院士（第 35 屆，2026 年當選）；研究領域為生物質譜技術與蛋白質體學。"
  bio_en: "Chen group is interested in developing advanced mass spectrometry-based proteomics strategies towards comprehensive profiling of human proteome, especially the druggable membrane sub-proteome and its post-translational modification to decipher complex disease mechanisms."
