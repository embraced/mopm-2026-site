- name: "吉田信介"
  name_en: "Shinsuke Yoshida"
  title_zh: "前副所長"
  title_en: "Former Deputy Director"
  affiliation_zh: "日本京都大學 CiRA 基金會"
  affiliation_en: "CiRA Foundation, Kyoto University, Japan"
  photo: ""
  bio_zh: "再生醫學轉譯專家，曾主導建立臨床級 HLA 純合子 iPSC 細胞庫品管（QA），現致力於細胞自動化製程開發及跨國精準醫療整合。"
  bio_en: "Translational researcher in regenerative medicine who led quality assurance (QA) for clinical-grade iPSC Haplobanks, now dedicated to automated cell manufacturing and integrating transnational precision medicine frameworks."
- name: "Aaron M. Newman"
  title_zh: "副教授"
  title_en: "Associate Professor"
  affiliation_zh: "美國史丹佛大學生物醫學數據科學系"
  affiliation_en: "Dept. of Biomedical Data Science, Stanford University"
  photo: "/speaker-aaron-newman.webp"
  bio_zh: "計算生物學家；CIBERSORT 與 CIBERSORTx 的開發者。這套計算框架能夠將混合的組織轉錄體解卷積成為獨立的細胞類型特徵，進而省去實體的細胞分選過程。"
  bio_en: "Computational biologist; creator of CIBERSORT/CIBERSORTx—a computational framework that deconvolves bulk tissue transcriptomes into distinct cell-type profiles without the need for physical cell sorting."
